openapi: 3.0.3
info:
  title: Switches API
  description: Consulta y actualizacion de switches del hogar inteligente.
  version: 1.0.0
servers:
  - url: http://localhost:8090
    description: switches-api (development)
tags:
  - name: Switches
    description: Consulta y actualizacion de switches
paths:
  /switches/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [ Switches ]
      summary: Obtiene el estado de un switch
      operationId: obtenerSwitch
      responses:
        '200':
          description: Estado actual del switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'
  /switches/{id}/comandos:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [ Switches ]
      summary: Acciona un switch
      operationId: accionarSwitch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchAccionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador del Switch.
      schema:
        type: string
  schemas:
    Switch:
      type: object
      required: [ idSwitch, estado, aplicadoEn ]
      properties:
        idSwitch:
          type: string
          example: switch-0
        estado:
          type: string
          enum: [ "ON", "OFF" ]
          example: "OFF"
        aplicadoEn:
          type: string
          format: date-time
          example: "2026-10-14T12:00:00Z"
    SwitchRequest:
      type: object
      required: [ accion ]
      properties:
        accion:
          type: string
          enum: [ "ON", "OFF" ]
          example: "ON"
    SwitchAccionResponse:
      allOf:
        - $ref: '#/components/schemas/Switch'
        - type: object
          required: [ cambio ]
          properties:
            cambio:
              type: boolean
              description: Indica si el estado del switch cambio con esta actualizacion.
              example: true
    Error:
      type: object
      required: [ error ]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: La peticion no tiene un formato valido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
