server.port=${MCP_SERVER_PORT:8081}

# ── Spring AI MCP Server Protocol & Type ─────────────────────────────────────
spring.ai.mcp.server.name=controlador-sitio-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# ── Streamable HTTP Configuration ────────────────────────────────────────────
# Endpoint único donde se maneja el streamable HTTP (por defecto /mcp)
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# ── HTTP client configuration (Opcion B: thin adapter over the controller) ──
controller.base-url=${CONTROLADOR_API_URL:http://localhost:8080}
controller.api-key=${CONTROLADOR_API_KEY:development-key}
switches.api-key=${SWITCHES_API_KEY:development-key}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=${APP_LOG_LEVEL:INFO}
logging.level.com.iiss.sensores.grupo_2.mcpserver=DEBUG
