version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - '1883:1883'
      - '9001:9001'

  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - '27017:27017'
    environment:
      #      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_ROOT_USERNAME}
      #      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongo_data:/data/db

  subscriber:
    build:
      context: ../src
      dockerfile: Dockerfile
      target: subscriber
    container_name: subscriber
    depends_on:
      mongodb:
        condition: service_started
      mosquitto:
        condition: service_started
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}
      MQTT_TOPIC: ${MQTT_TOPIC}

      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_COLLECTION_HABITACIONES: ${MONGODB_COLLECTION_HABITACIONES}
      MONGODB_COLLECTION_MEDICIONES: ${MONGODB_COLLECTION_MEDICIONES}
    restart: unless-stopped

  publisher:
    build:
      context: ../src
      dockerfile: Dockerfile
      target: publisher
    container_name: publisher
    depends_on:
      mongodb:
        condition: service_started
      mosquitto:
        condition: service_started
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
    restart: unless-stopped

  rooms-api:
    build:
      context: ../src
      dockerfile: Dockerfile
      target: rooms-api
    container_name: rooms-api
    depends_on:
      mongodb:
        condition: service_started
      mosquitto:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATA_MONGODB_DATABASE: ${MONGODB_DATABASE}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
    ports:
      - '8080:8080'
    restart: unless-stopped

  switches-api:
    build:
      context: ../src
      dockerfile: Dockerfile
      target: switches-api
    container_name: switches-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SWITCHES_API_KEY: ${SWITCHES_API_KEY}
    ports:
      - '${SWITCHES_API_PORT:-8090}:${SWITCHES_API_PORT:-8090}'
    restart: unless-stopped

volumes:
  mongo_data:
