name: Build & Test
run-name: New changes pushed by @${{ github.actor }} 🚀
on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Development
    env:
      MQTT_BROKER_URL: ${{ vars.MQTT_BROKER_URL }}
      MQTT_CLIENT_ID: ${{ vars.MQTT_CLIENT_ID }}
      MQTT_TOPIC: ${{ vars.MQTT_TOPIC }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build project
        run: mvn -B -DskipTests package

      - name: Run unit tests
        run: mvn -B test
