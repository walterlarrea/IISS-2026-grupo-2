openapi: 3.0.3
info:
  title: Rooms API
  description: Gestión de habitaciones del hogar inteligente.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: rooms-api (development)
tags:
  - name: Habitaciones
    description: Gestion de habitaciones
paths:
  /habitaciones:
    get:
      tags: [Habitaciones]
      summary: Lista todas las habitaciones
      operationId: listarHabitaciones
      responses:
        '200':
          description: Lista de habitaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habitacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Habitaciones]
      summary: Crea una habitacion
      operationId: crearHabitacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitacionInput'
      responses:
        '200':
          description: Habitacion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habitacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /habitaciones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Habitaciones]
      summary: Obtiene una habitacion por su identificador
      operationId: obtenerHabitacion
      responses:
        '200':
          description: Habitacion encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habitacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Habitaciones]
      summary: Reemplaza una habitacion
      operationId: reemplazarHabitacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitacionInput'
      responses:
        '200':
          description: Habitacion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habitacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Habitaciones]
      summary: Actualiza parcialmente una habitacion
      operationId: actualizarParcialmenteHabitacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Campos de Habitacion que se desean modificar.
      responses:
        '200':
          description: Habitacion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habitacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Habitaciones]
      summary: Elimina una habitacion
      operationId: eliminarHabitacion
      responses:
        '204':
          description: Habitacion eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /habitaciones/termostato/{idTermostato}:
    parameters:
      - name: idTermostato
        in: path
        required: true
        description: Identificador del termostato asociado.
        schema:
          type: string
    get:
      tags: [Habitaciones]
      summary: Obtiene una habitacion por su termostato
      operationId: obtenerHabitacionPorTermostato
      responses:
        '200':
          description: Habitacion encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habitacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador del recurso.
      schema:
        type: string
  schemas:
    Habitacion:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        nombre:
          type: string
        temperaturaEsperada:
          type: number
          format: double
        idTermostato:
          type: string
        idSwitch:
          type: string
    HabitacionInput:
      type: object
      properties:
        nombre:
          type: string
        temperaturaEsperada:
          type: number
          format: double
        idTermostato:
          type: string
        idSwitch:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: La peticion no tiene un formato valido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Falta la cabecera X-API-KEY.
    Forbidden:
      description: La cabecera X-API-KEY no es valida.
    NotFound:
      description: Recurso no encontrado.
security:
  - ApiKey: []
