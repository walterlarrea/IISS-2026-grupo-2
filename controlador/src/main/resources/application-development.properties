server.port=${CONTROLADOR_API_PORT:${CONTROLADOR_API_PORT:8080}}
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:ControladorSubscriber}
mqtt.topic=${MQTT_TOPIC:sensores/temperatura}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:sensores}

mongodb.collection.habitaciones=${MONGODB_COLLECTION_HABITACIONES:habitaciones}
mongodb.collection.mediciones=${MONGODB_COLLECTION_MEDICIONES:mediciones}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].name = Controller API
springdoc.swagger-ui.urls[0].url = /docs/controller-api-openapi.yml
springdoc.swagger-ui.urls[1].name = Switches API
springdoc.swagger-ui.urls[1].url = /docs/switches-api-openapi.yml

controlador:
    reevaluacion-ms: ${REGISTRATION_RETRY_MS:5000}